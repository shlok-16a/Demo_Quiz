<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#070707">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>Quiz</title>
    <link rel="stylesheet" href="css/style.css?v=55">
</head>
<body class="quiz-page">

    <div class="quiz-nav">
        <div class="quiz-score-chip quiz-running-score" id="runningScore" aria-live="polite">
            <span class="eyebrow">Score</span>
            <span class="hud-value">0</span>
        </div>
    </div>

    <div class="quiz-timer-stack">
        <div class="timer-wrap" id="timerWrap">
            <svg class="timer-ring" viewBox="0 0 36 36" aria-hidden="true">
                <circle class="timer-ring-track" cx="18" cy="18" r="15.5" fill="none"></circle>
                <circle class="timer-ring-fill" id="timerFill" cx="18" cy="18" r="15.5" fill="none" pathLength="100"></circle>
            </svg>
            <p id="timer">&ndash;&ndash;</p>
        </div>
        <div id="progress" class="question-pips" role="img" aria-label="Question progress"></div>
    </div>

    <div class="question-stage">
        <div class="question-card">
            <h3 id="question"></h3>

            <div class="option-stack">
                <button type="button" id="option1"></button>
                <button type="button" id="option2"></button>
                <button type="button" id="option3"></button>
            </div>
        </div>
    </div>

    <button type="button" id="skipBtn">Skip</button>

    <p id="status" class="quiz-status" style="display:none;"></p>

    <div id="feedbackBanner" class="quiz-feedback-banner" role="status" aria-live="polite"></div>

    <div id="nextCountdownOverlay" class="modal-overlay countdown-overlay" aria-live="polite">
        <div class="countdown-card">
            <p id="nextCountdownLabel" class="eyebrow" style="margin-bottom:10px;">Next question loading in</p>
            <div id="nextCountdownNumber" class="countdown-number">5</div>
        </div>
    </div>

    <script src="js/questions.js?v=28"></script>
    <script src="js/quiz.js?v=55"></script>

</body>
</html>
