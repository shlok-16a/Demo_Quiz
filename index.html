<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#070707">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>Quiz</title>
    <link rel="stylesheet" href="css/style.css?v=61">
</head>
<body class="intro-page stage-page">

    <div class="quiz-topbar">
        <img src="assets/img/logo.svg" alt="16Arena" class="brand-logo">
    </div>

    <div id="playReady" class="play-ready">
        <div class="question-stage">
            <div class="question-card intro-card ar-rise">
                <h2 id="playReadyTitle">Welcome to Quiz</h2>

                <div id="playReadyFormatBlock" class="play-ready-rules-block">
                    <span class="play-ready-heading">Quiz Format</span>
                    <ul id="playReadyScoring" class="play-ready-scoring"></ul>
                </div>

                <div id="playReadyRulesBlock" class="play-ready-rules-block">
                    <span class="play-ready-heading">Rules</span>
                    <ul id="playReadyRules" class="play-ready-rules"></ul>
                </div>
            </div>
        </div>
        <button type="button" id="playStartBtn" onclick="onPoolPlayStart()">Start</button>
    </div>

    <div id="startCountdownOverlay" class="modal-overlay countdown-overlay" aria-live="polite">
        <div class="countdown-card">
            <p id="startCountdownLabel" class="eyebrow" style="margin-bottom:10px;">Question 1 loading in</p>
            <div id="startCountdownNumber" class="countdown-number">5</div>
        </div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/intro.js"></script>

</body>
</html>
